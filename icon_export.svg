<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">

  <!-- White background -->
  <rect width="108" height="108" fill="#FFFFFF"/>

  <!-- Cardboard silhouette — head -->
  <path fill="#C8A050" stroke="#A07830" stroke-width="0.7"
    d="M54,41.5 A4.5,4.5 0 0,1 58.5,46 A4.5,4.5 0 0,1 54,50.5 A4.5,4.5 0 0,1 49.5,46 A4.5,4.5 0 0,1 54,41.5 Z"/>

  <!-- Cardboard silhouette — body -->
  <path fill="#C8A050" stroke="#A07830" stroke-width="0.7"
    d="M44,52 L64,52 L61.5,68 L46.5,68 Z"/>

  <!-- 65 MOA circle ring -->
  <path fill="none" stroke="#FF2020" stroke-width="2.8"
